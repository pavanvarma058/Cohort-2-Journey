<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Page</title>
</head>
<body>
    <form id="login-form" action="">First Name: <input type="text" name="firstName" placeholder="first name">
    <br> Last Name: <input type="text" name="lastName" placeholder="last name"> <br>
    <input type="submit" value="Submit" style="margin-top: 10px;"> <br>
    </form>

    <p>Click the "Try it" button to display the first name</p>

    <button onclick="displayName()">Try it</button>

    <p id="displayName"></p>

    <script>
        function displayName(){
            let x = document.getElementById("login-form").elements.length;
            let y = document.getElementById("login-form").elements[0].value;
            document.getElementById("displayName").innerHTML = "Found " + x
                + " elements in the form."  + " and first name entered is: " + y;
        } 

        const para = document.createElement("p");
        para.innerText = "This is a new paragraph created using DOM methods.";
        document.body.appendChild(para);
    </script>

</body>
</html>
