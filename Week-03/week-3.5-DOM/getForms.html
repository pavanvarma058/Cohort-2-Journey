<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Forms</title>
</head>
<body>
    <form id="form1" action="">First Name: <input type="text" name="firstName" placeholder="first name">
    <br> Last Name: <input type="text" name="lastName" placeholder="last name"> <br>
    <input type="submit" value="Submit" onclick="info()" style="margin-top: 10px;"> <br>
    </form>

    <p>These are the values entered in the form:</p>

    <p id="demo"></p>

    <script>
        const form = document.forms['form1'];
        let text = "";
        for(let i=0; i < form.length; i++){
            text += form.elements[i].value + "";
        }
        function info(){
            document.getElementById("demo").innerHTML = text;
        }
        

    </script>
</body>
</html>
