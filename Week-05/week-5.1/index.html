<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="onBtnPress()" id="btn" style="background-color: rebeccapurple; color: white; cursor: pointer;">Counter 0</button>

    <script>
        function onBtnPress(){
            const btn = document.getElementById("btn").innerHTML;
            console.log(btn.split(" "));
            const counter = btn.split(" ")[1];
            const newCounter = parseInt(counter) + 1;
            document.getElementById("btn").innerHTML = `Counter ${newCounter}`;
        }
    </script>
</body>
</html>
