<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body>
    <div>
        <input id="title" type="text" placeholder="title">
        <br> <br>
        <input id="description" type="text"  placeholder="description">
        <br> <br>
        <button onclick="addTodo()">Add Todo</button>
        <div id="container"></div>
    </div>

    <script>
        let globalId = 0;

        function createChild(title, description, id){
            const child = document.createElement('div');
            const firstGrandChild = document.createElement('div');
            firstGrandChild.innerText = title
            const secondGrandChild = document.createElement('div');
            secondGrandChild.innerText = description;
            const thirdGrandChild = document.createElement('button');
            thirdGrandChild.innerText = 'Mark as Done';
            thirdGrandChild.setAttribute("onclick", `markAsDone(${id})`);
            child.appendChild(firstGrandChild);
            child.appendChild(secondGrandChild);
            child.appendChild(thirdGrandChild);
            child.setAttribute("id", id);
            return child;
        }

        // state will always be an array
        // Every element of the state would have a title, description and id

        function updateDomAccToState(state){
            const parent = document.getElementById('container');
            parent.innerHTML = "";
            for(let i=0; i<state.length; i++){
                const child = createChild(state[i].title, state[i].description, state[i].id);
                parent.appendChild(child);
            }
        }
        updateDomAccToState([{
            title: "Go to gym",
            description: "Go to gym at 7 in the morning",
            id: 1  
        }]);
    </script>
</body>
</html>
