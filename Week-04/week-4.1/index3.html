<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator</title>
</head>
<body>
    <input id="principal" type="text" placeholder="Principal Amount">
    <br>
    <input id="rate" type="text" placeholder="Rate of Interest" style="margin-top: 10px;"> 
    <br/>
    <input id="time" type="text" placeholder="Time (years)" style="margin-top: 10px;"> 
    <br/>
    <button style="margin-top: 10px;" onclick="calculateInterest()">Calculate Interest</button>
    <p id="interest"></p>

    <script>
        async function calculateInterest(){
            const p = document.getElementById('principal').value;
            const r = document.getElementById('rate').value;
            const t = document.getElementById('time').value;
            const response = await fetch(`http://localhost:3000/interest?principal=${p}&rate=${r}&time=${t}`);
            const data = await response.text();
            document.getElementById('interest').innerHTML = `${data}`;
        }
    </script>
</body>
</html>
