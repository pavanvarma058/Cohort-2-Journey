<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator 2</title>
</head>
<body>
    <input id="firstNumber" type="text" placeholder="First Number">
    <br>
    <input id="secondNumber" type="text" placeholder="Second Number" style="margin-top: 10px;"> 
    <br/>
    <button style="margin-top: 10px;" onclick="populateSum()">Calculate Sum</button>
    <p id="sum"></p>

    <script>
        function populateSum() {
            const a = document.getElementById('firstNumber').value;
            const b = document.getElementById('secondNumber').value;
            fetch(`http://localhost:3000/sum?a=${a}&b=${b}`)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('sum').innerHTML = `${data}`;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('sum').innerHTML = 'Error calculating sum';
                });
        }
        
    </script>
</body>
</html>
